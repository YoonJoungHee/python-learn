<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파이썬 조건문 구조 완성하기</title>
    <style>
        :root {
            --bg: #121214;
            --surface: #1a1a1e;
            --card-bg: #18181c;
            --slot-bg: #26262b;
            --border: #2d2d34;
            --border-dim: #44475a;
            --text: #e3e3e6;
            --text-dim: #8b8b96;
            --kw: #ff79c6;
            --cond: #f1fa8c;
            --colon: #8be9fd;
            --stmt: #50fa7b;
            --el: #ffb86c;
            --elif: #bd93f9;
            --indent-color: #ff6e9130;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            min-height: 100vh;
            padding: 24px 16px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 홈 링크 */
        .home-nav {
            width: 100%;
            max-width: 800px;
            margin-bottom: 16px;
        }
        .home-nav a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.82rem;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.18s;
        }
        .home-nav a:hover {
            color: var(--text);
            background: var(--surface);
        }

        /* 헤더 */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }
        .header p {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        /* 탭 */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            background: var(--surface);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .tab-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--text-dim);
            font-size: 0.82rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tab-btn:hover { color: var(--text); background: var(--border); }
        .tab-btn.active {
            background: #282830;
            color: var(--text);
            border: 1px solid var(--border-dim);
        }
        .tab-btn .badge {
            display: inline-block;
            background: var(--border-dim);
            color: var(--text-dim);
            font-size: 0.7rem;
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 5px;
        }

        /* 진행 표시 */
        .progress-bar-wrap {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .progress-bar-bg {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--stmt);
            border-radius: 99px;
            transition: width 0.4s ease;
            width: 0%;
        }
        .progress-label {
            font-size: 0.78rem;
            color: var(--text-dim);
            min-width: 70px;
            text-align: right;
        }

        /* 문제 네비 */
        .q-nav {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            width: 100%;
            max-width: 800px;
        }
        .q-nav-dots {
            display: flex;
            gap: 6px;
        }
        .q-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1.5px solid var(--border-dim);
            background: var(--surface);
            color: var(--text-dim);
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .q-dot.current { border-color: var(--colon); color: var(--colon); background: rgba(139,233,253,0.1); }
        .q-dot.correct { border-color: var(--stmt); background: rgba(80,250,123,0.15); color: var(--stmt); }
        .q-dot.wrong { border-color: #ff5555; background: rgba(255,85,85,0.1); color: #ff5555; }
        .q-nav-label {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        /* 미션 박스 */
        .mission-box {
            background: #1e1e24;
            border-left: 4px solid var(--colon);
            padding: 14px 18px;
            width: 100%;
            max-width: 800px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            line-height: 1.7;
        }
        .mission-box .tag {
            display: inline-block;
            background: rgba(139,233,253,0.15);
            color: var(--colon);
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        .mission-box code {
            background: rgba(255,255,255,0.07);
            padding: 1px 5px;
            border-radius: 3px;
            font-family: 'Consolas', monospace;
            font-size: 0.88em;
            color: var(--cond);
        }

        /* 힌트 표시 */
        .type-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            margin-bottom: 20px;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid;
        }
        .type-badge.if-only { color: var(--kw); border-color: rgba(255,121,198,0.3); background: rgba(255,121,198,0.07); }
        .type-badge.if-else { color: var(--el); border-color: rgba(255,184,108,0.3); background: rgba(255,184,108,0.07); }
        .type-badge.if-elif { color: var(--elif); border-color: rgba(189,147,249,0.3); background: rgba(189,147,249,0.07); }
        .type-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        /* 카드 창고 */
        .card-pool {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            width: 100%;
            max-width: 800px;
            min-height: 58px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .card-pool-label {
            width: 100%;
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        /* 드래그 카드 */
        .drag-card {
            padding: 7px 14px;
            border-radius: 6px;
            cursor: grab;
            font-family: 'Consolas', monospace;
            font-weight: 600;
            font-size: 1rem;
            user-select: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: transform 0.15s, opacity 0.15s;
        }
        .drag-card:active { cursor: grabbing; transform: scale(0.94); }
        .drag-card.dragging { opacity: 0.4; }

        .c-kw  { background: rgba(255,121,198,0.15); border: 1.5px solid var(--kw);   color: var(--kw); }
        .c-cd  { background: rgba(241,250,140,0.15); border: 1.5px solid var(--cond); color: var(--cond); }
        .c-col { background: rgba(139,233,253,0.15); border: 1.5px solid var(--colon);color: var(--colon); }
        .c-st  { background: rgba(80,250,123,0.15);  border: 1.5px solid var(--stmt); color: var(--stmt); }
        .c-el  { background: rgba(255,184,108,0.15); border: 1.5px solid var(--el);   color: var(--el); }
        .c-elif{ background: rgba(189,147,249,0.15); border: 1.5px solid var(--elif); color: var(--elif); }

        /* 코드 조립 영역 */
        .code-zone {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 100%;
            max-width: 800px;
            padding: 24px 28px;
            font-family: 'Consolas', monospace;
            font-size: 1.05rem;
            line-height: 1;
            margin-bottom: 20px;
        }

        .code-line {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 46px;
            position: relative;
        }
        .code-line + .code-line {
            margin-top: 4px;
        }

        /* 들여쓰기 */
        .indent {
            display: flex;
            align-items: center;
            width: 32px;
            height: 42px;
            flex-shrink: 0;
        }
        .indent::before {
            content: '';
            display: block;
            width: 20px;
            height: 100%;
            border-left: 2px solid var(--indent-color);
        }

        /* 드롭 슬롯 */
        .drop-slot {
            background: var(--slot-bg);
            border: 1.5px dashed var(--border-dim);
            border-radius: 6px;
            min-width: 80px;
            height: 38px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            transition: background 0.15s, border-color 0.15s;
            padding: 0 4px;
        }
        .drop-slot.drag-over {
            background: #343746;
            border-color: var(--elif);
            border-style: solid;
        }
        .drop-slot.correct { border-color: var(--stmt); border-style: solid; }
        .drop-slot.wrong   { border-color: #ff5555;    border-style: solid; }

        /* 버튼 */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 22px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.18s;
        }
        .btn-check { background: var(--stmt); color: #111; }
        .btn-check:hover { background: #38d462; }
        .btn-reset { background: transparent; color: var(--text-dim); border: 1px solid var(--border-dim); }
        .btn-reset:hover { background: var(--surface); color: var(--text); }
        .btn-next  { background: var(--colon); color: #111; display: none; }
        .btn-next:hover { background: #6acfe8; }

        /* 피드백 */
        .feedback {
            width: 100%;
            max-width: 800px;
            padding: 12px 18px;
            border-radius: 7px;
            font-size: 0.88rem;
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .feedback.show { display: flex; }
        .feedback.ok   { background: rgba(80,250,123,0.1); border: 1px solid rgba(80,250,123,0.3); color: var(--stmt); }
        .feedback.fail { background: rgba(255,85,85,0.1);  border: 1px solid rgba(255,85,85,0.3);  color: #ff7070; }

        /* 점수 완료 화면 */
        .result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
        }
        .result-screen.show { display: flex; }
        .result-big {
            font-size: 4rem;
            font-weight: 700;
        }
        .result-msg { font-size: 1.1rem; color: var(--text-dim); }
        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }
        .result-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }
        .result-card .val { font-size: 1.6rem; font-weight: 700; }
        .result-card .lbl { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }
        .btn-restart { background: var(--kw); color: #111; padding: 12px 30px; font-size: 1rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; }

        /* 정답 보기 */
        .answer-reveal {
            width: 100%;
            max-width: 800px;
            background: #1a1f24;
            border: 1px solid #2a3040;
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 0.82rem;
            display: none;
            margin-bottom: 14px;
        }
        .answer-reveal.show { display: block; }
        .answer-reveal pre {
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            line-height: 1.8;
            color: var(--text);
            margin-top: 8px;
        }
        .answer-reveal .al { color: var(--text-dim); font-size: 0.75rem; margin-bottom: 6px; }
    </style>
</head>
<body>

<div class="home-nav">
    <a href="https://yoonjounghee.github.io/python-learn/home.html">← 홈</a>
</div>

<div class="header">
    <h1>💻 파이썬 조건문 구조 완성하기</h1>
    <p>카드를 드래그해서 빈칸에 놓으세요</p>
</div>

<!-- 탭 -->
<div class="tabs" id="tabs">
    <button class="tab-btn active" onclick="switchGroup(0)" id="tab0">if 단독 <span class="badge">3</span></button>
    <button class="tab-btn"        onclick="switchGroup(1)" id="tab1">if / else <span class="badge">3</span></button>
    <button class="tab-btn"        onclick="switchGroup(2)" id="tab2">if / elif / else <span class="badge">2</span></button>
</div>

<!-- 진행바 -->
<div class="progress-bar-wrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 3 맞힘</div>
</div>

<!-- 문제 네비 -->
<div class="q-nav" id="qNav">
    <div class="q-nav-dots" id="qDots"></div>
    <div class="q-nav-label" id="qNavLabel"></div>
</div>

<!-- 미션 -->
<div class="mission-box" id="missionBox"></div>

<!-- 유형 배지 -->
<div id="typeBadge"></div>

<!-- 카드창고 -->
<div class="card-pool" id="cardPool">
    <div class="card-pool-label">📋 카드를 드래그해서 빈칸에 놓으세요</div>
</div>

<!-- 코드 조립 -->
<div class="code-zone" id="codeZone"></div>

<!-- 피드백 -->
<div class="feedback" id="feedback"></div>

<!-- 정답 보기 -->
<div class="answer-reveal" id="answerReveal"></div>

<!-- 버튼 -->
<div class="btn-row">
    <button class="btn btn-check" onclick="checkAnswer()">정답 확인</button>
    <button class="btn btn-reset" onclick="resetQuiz()">↺ 초기화</button>
    <button class="btn btn-next"  id="btnNext" onclick="nextQuestion()">다음 문제 →</button>
</div>

<!-- 결과 화면 -->
<div class="result-screen" id="resultScreen">
    <div class="result-big" id="resultEmoji">🎉</div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="result-grid">
        <div class="result-card">
            <div class="val" id="rCorrect" style="color:var(--stmt)">0</div>
            <div class="lbl">정답</div>
        </div>
        <div class="result-card">
            <div class="val" id="rWrong" style="color:#ff5555">0</div>
            <div class="lbl">오답</div>
        </div>
        <div class="result-card">
            <div class="val" id="rScore" style="color:var(--colon)">0%</div>
            <div class="lbl">정확도</div>
        </div>
    </div>
    <button class="btn-restart" onclick="restartGroup()">다시 풀기</button>
</div>

<script>
/* ============================================================
   문제 데이터
   type: 'if' | 'if-else' | 'if-elif'
   lines: 각 라인 배열
     indent: true이면 들여쓰기 블록
     slots: [{ id, ans, label, cls, width }]  — 슬롯 목록 (ans=정답 data-val)
     fixed: [{ label, cls }]  — 고정 텍스트 (드롭 아님)
   cards: { id, val, label, cls }[]  — 카드창고에 등장할 카드들
   answer: 정답 보기용 코드 문자열
============================================================ */

const GROUPS = [
  /* ────── 그룹 0: if 단독 ────── */
  [
    {
      type: 'if-only',
      mission: '변수 <code>score</code>가 60 이상이면 <code>"합격입니다"</code>를 출력하는 if 단독 조건문을 완성하세요.',
      answer: `if score >= 60:\n    print("합격입니다")`,
      lines: [
        { slots: [
            { id:'s1', ans:'KW_if',      cls:'c-kw',  label:'if',            width:50 },
            { id:'s2', ans:'CD_gte60',   cls:'c-cd',  label:'score >= 60',   width:120 },
            { id:'s3', ans:'COL1',       cls:'c-col', label:':',             width:36 }
        ]},
        { indent:true, slots:[
            { id:'s4', ans:'ST_pass',    cls:'c-st',  label:'print("합격입니다")', width:180 }
        ]}
      ],
      cards: [
        { id:'c1', val:'KW_if',    cls:'c-kw',  label:'if' },
        { id:'c2', val:'CD_gte60', cls:'c-cd',  label:'score >= 60' },
        { id:'c3', val:'COL1',     cls:'c-col', label:':' },
        { id:'c4', val:'ST_pass',  cls:'c-st',  label:'print("합격입니다")' },
        { id:'c5', val:'CD_gt60',  cls:'c-cd',  label:'score > 60' },
        { id:'c6', val:'CD_eq60',  cls:'c-cd',  label:'score == 60' },
      ]
    },
    {
      type: 'if-only',
      mission: '변수 <code>num</code>이 0보다 크면 <code>"양수입니다"</code>를 출력하는 if 단독 조건문을 완성하세요.',
      answer: `if num > 0:\n    print("양수입니다")`,
      lines: [
        { slots: [
            { id:'s1', ans:'KW_if',    cls:'c-kw',  label:'if',           width:50 },
            { id:'s2', ans:'CD_pos',   cls:'c-cd',  label:'num > 0',      width:100 },
            { id:'s3', ans:'COL1',     cls:'c-col', label:':',            width:36 }
        ]},
        { indent:true, slots:[
            { id:'s4', ans:'ST_pos',   cls:'c-st',  label:'print("양수입니다")', width:180 }
        ]}
      ],
      cards: [
        { id:'c1', val:'KW_if',  cls:'c-kw',  label:'if' },
        { id:'c2', val:'CD_pos', cls:'c-cd',  label:'num > 0' },
        { id:'c3', val:'COL1',   cls:'c-col', label:':' },
        { id:'c4', val:'ST_pos', cls:'c-st',  label:'print("양수입니다")' },
        { id:'c5', val:'CD_neg', cls:'c-cd',  label:'num < 0' },
        { id:'c6', val:'CD_zero',cls:'c-cd',  label:'num == 0' },
      ]
    },
    {
      type: 'if-only',
      mission: '변수 <code>name</code>이 <code>"홍길동"</code>과 같으면 <code>"반갑습니다, 홍길동님!"</code>을 출력하는 if 단독 조건문을 완성하세요.',
      answer: `if name == "홍길동":\n    print("반갑습니다, 홍길동님!")`,
      lines: [
        { slots: [
            { id:'s1', ans:'KW_if',    cls:'c-kw',  label:'if',              width:50 },
            { id:'s2', ans:'CD_name',  cls:'c-cd',  label:'name == "홍길동"', width:160 },
            { id:'s3', ans:'COL1',     cls:'c-col', label:':',               width:36 }
        ]},
        { indent:true, slots:[
            { id:'s4', ans:'ST_hello', cls:'c-st',  label:'print("반갑습니다, 홍길동님!")', width:260 }
        ]}
      ],
      cards: [
        { id:'c1', val:'KW_if',    cls:'c-kw',  label:'if' },
        { id:'c2', val:'CD_name',  cls:'c-cd',  label:'name == "홍길동"' },
        { id:'c3', val:'COL1',     cls:'c-col', label:':' },
        { id:'c4', val:'ST_hello', cls:'c-st',  label:'print("반갑습니다, 홍길동님!")' },
        { id:'c5', val:'CD_name2', cls:'c-cd',  label:'name != "홍길동"' },
        { id:'c6', val:'ST_bye',   cls:'c-st',  label:'print("모르는 사람입니다")' },
      ]
    }
  ],

  /* ────── 그룹 1: if / else ────── */
  [
    {
      type: 'if-else',
      mission: '나이(<code>age</code>)가 19 이상이면 <code>"성인입니다"</code>를, 그렇지 않으면 <code>"미성년자입니다"</code>를 출력하는 if-else 조건문을 완성하세요.',
      answer: `if age >= 19:\n    print("성인입니다")\nelse:\n    print("미성년자입니다")`,
      lines: [
        { slots:[
            { id:'s1', ans:'KW_if',  cls:'c-kw',  label:'if',        width:50 },
            { id:'s2', ans:'CD_age', cls:'c-cd',  label:'age >= 19', width:110 },
            { id:'s3', ans:'COL1',   cls:'c-col', label:':',         width:36 }
        ]},
        { indent:true, slots:[
            { id:'s4', ans:'ST_adult', cls:'c-st', label:'print("성인입니다")', width:180 }
        ]},
        { slots:[
            { id:'s5', ans:'KW_else', cls:'c-el',  label:'else', width:60 },
            { id:'s6', ans:'COL2',    cls:'c-col', label:':',    width:36 }
        ]},
        { indent:true, slots:[
            { id:'s7', ans:'ST_minor', cls:'c-st', label:'print("미성년자입니다")', width:200 }
        ]}

/* ============================================================
   상태 관리
============================================================ */
let currentGroup = 0;
let currentQ     = 0;
let scores       = [];   // 그룹별 문제 결과 배열
let checked      = false;
let draggedCard  = null;

function initGroup(gIdx) {
    currentGroup = gIdx;
    currentQ = 0;
    scores = new Array(GROUPS[gIdx].length).fill(null);
    checked = false;
    updateTabUI();
    renderQuestion();
    updateProgressUI();
}

function updateTabUI() {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', i === currentGroup);
    });
}

function switchGroup(gIdx) {
    initGroup(gIdx);
}

/* ============================================================
   렌더링
============================================================ */
function renderQuestion() {
    const q = GROUPS[currentGroup][currentQ];
    checked = false;

    /* 미션 */
    const mBox = document.getElementById('missionBox');
    mBox.innerHTML = `<div class="tag">📌 미션 ${currentQ + 1}</div><br>${q.mission}`;

    /* 유형 배지 */
    const badge = document.getElementById('typeBadge');
    const typeMap = {
        'if-only': ['if-only', 'if 단독'],
        'if-else': ['if-else', 'if / else'],
        'if-elif': ['if-elif', 'if / elif / else']
    };
    const [cls, label] = typeMap[q.type];
    badge.innerHTML = `<div class="type-badge ${cls}"><span class="dot"></span>${label} 구조</div>`;

    /* 카드 창고 (셔플) */
    const pool = document.getElementById('cardPool');
    pool.innerHTML = `<div class="card-pool-label">📋 카드를 드래그해서 빈칸에 놓으세요</div>`;
    const shuffled = [...q.cards].sort(() => Math.random() - 0.5);
    shuffled.forEach(c => {
        const el = document.createElement('div');
        el.className = `drag-card ${c.cls}`;
        el.id = c.id;
        el.dataset.val = c.val;
        el.draggable = true;
        el.textContent = c.label;
        pool.appendChild(el);
    });

    /* 코드 조립 영역 */
    const zone = document.getElementById('codeZone');
    zone.innerHTML = '';
    q.lines.forEach(line => {
        const lineEl = document.createElement('div');
        lineEl.className = 'code-line';
        if (line.indent) {
            const ind = document.createElement('div');
            ind.className = 'indent';
            lineEl.appendChild(ind);
        }
        line.slots.forEach(s => {
            const sl = document.createElement('div');
            sl.className = 'drop-slot';
            sl.id = s.id;
            sl.dataset.ans = s.ans;
            sl.style.minWidth = (s.width || 80) + 'px';
            lineEl.appendChild(sl);
        });
        zone.appendChild(lineEl);
    });

    /* 피드백 / 정답 숨기기 */
    hideFeedback();
    document.getElementById('answerReveal').classList.remove('show');
    document.getElementById('btnNext').style.display = 'none';

    /* 이벤트 재바인딩 */
    bindDragEvents();
    updateQDots();
    updateProgressUI();

    /* 결과화면 숨기기 */
    document.getElementById('resultScreen').classList.remove('show');
    document.querySelector('.card-pool').style.display = '';
    document.getElementById('codeZone').style.display = '';
    document.getElementById('missionBox').style.display = '';
    document.getElementById('typeBadge').style.display = '';
    document.querySelector('.btn-row').style.display = '';
}

function updateQDots() {
    const dots = document.getElementById('qDots');
    const total = GROUPS[currentGroup].length;
    dots.innerHTML = '';
    for (let i = 0; i < total; i++) {
        const d = document.createElement('div');
        d.className = 'q-dot';
        d.textContent = i + 1;
        if (i === currentQ) d.classList.add('current');
        if (scores[i] === true)  d.classList.add('correct');
        if (scores[i] === false) d.classList.add('wrong');
        d.onclick = () => { currentQ = i; renderQuestion(); };
        dots.appendChild(d);
    }
    document.getElementById('qNavLabel').textContent =
        `문제 ${currentQ + 1} / ${total}`;
}

function updateProgressUI() {
    const total   = GROUPS[currentGroup].length;
    const correct = scores.filter(s => s === true).length;
    document.getElementById('progressFill').style.width =
        (total ? (correct / total) * 100 : 0) + '%';
    document.getElementById('progressLabel').textContent =
        `${correct} / ${total} 맞힘`;
}

/* ============================================================
   드래그 & 드롭
============================================================ */
function bindDragEvents() {
    document.querySelectorAll('.drag-card').forEach(card => {
        card.addEventListener('dragstart', e => {
            draggedCard = card;
            e.dataTransfer.setData('text/plain', card.id);
            setTimeout(() => card.classList.add('dragging'), 0);
        });
        card.addEventListener('dragend', () => {
            draggedCard = null;
            card.classList.remove('dragging');
        });
    });

    const targets = [
        ...document.querySelectorAll('.drop-slot'),
        document.getElementById('cardPool')
    ];

    targets.forEach(t => {
        t.addEventListener('dragover', e => {
            e.preventDefault();
            if (t.classList.contains('drop-slot')) t.classList.add('drag-over');
        });
        t.addEventListener('dragleave', () => t.classList.remove('drag-over'));
        t.addEventListener('drop', e => {
            e.preventDefault();
            t.classList.remove('drag-over');
            if (!draggedCard) return;

            if (t.classList.contains('drop-slot')) {
                if (t.children.length === 0) {
                    // 원래 위치에서 제거
                    if (draggedCard.parentElement.classList.contains('drop-slot')) {
                        draggedCard.parentElement.classList.remove('correct','wrong');
                        draggedCard.parentElement.style.borderColor = '';
                    }
                    t.appendChild(draggedCard);
                    if (checked) { t.classList.remove('correct','wrong'); }
                } else {
                    // 슬롯에 카드 있으면 교환
                    const existing = t.children[0];
                    const src = draggedCard.parentElement;
                    if (src.classList.contains('drop-slot')) {
                        src.appendChild(existing);
                        src.classList.remove('correct','wrong');
                    } else {
                        document.getElementById('cardPool').appendChild(existing);
                    }
                    t.appendChild(draggedCard);
                    if (checked) { t.classList.remove('correct','wrong'); }
                }
            } else {
                // 창고로 반환
                if (draggedCard.parentElement.classList.contains('drop-slot')) {
                    draggedCard.parentElement.classList.remove('correct','wrong');
                    draggedCard.parentElement.style.borderColor = '';
                }
                document.getElementById('cardPool').appendChild(draggedCard);
            }
        });
    });
}

/* ============================================================
   정답 확인
============================================================ */
function checkAnswer() {
    const slots = document.querySelectorAll('.drop-slot');
    let allCorrect = true;
    let missing = false;

    slots.forEach(slot => {
        slot.classList.remove('correct','wrong');
        const expected = slot.dataset.ans;
        if (slot.children.length === 0) {
            missing = true;
            slot.classList.add('wrong');
        } else {
            const actual = slot.children[0].dataset.val;
            if (actual === expected) {
                slot.classList.add('correct');
            } else {
                allCorrect = false;
                slot.classList.add('wrong');
            }
        }
    });

    checked = true;

    if (missing) {
        showFeedback('fail', '⚠️ 모든 빈칸을 채워주세요!');
        return;
    }

    const total = GROUPS[currentGroup].length;
    if (allCorrect) {
        scores[currentQ] = true;
        showFeedback('ok', '🎉 정답입니다! 완벽한 파이썬 코드예요!');
    } else {
        scores[currentQ] = false;
        showFeedback('fail', '❌ 틀린 부분이 있습니다. 빨간 슬롯을 확인해보세요.');
        showAnswer();
    }

    updateQDots();
    updateProgressUI();

    // 마지막 문제이면 완료 버튼, 아니면 다음 버튼
    const isLast = currentQ === total - 1;
    const btn = document.getElementById('btnNext');
    btn.style.display = 'inline-block';
    btn.textContent = isLast ? '결과 보기 →' : '다음 문제 →';
}

function showAnswer() {
    const q = GROUPS[currentGroup][currentQ];
    const box = document.getElementById('answerReveal');
    box.innerHTML = `<div class="al">💡 정답 코드</div><pre>${escHtml(q.answer)}</pre>`;
    box.classList.add('show');
}

function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showFeedback(type, msg) {
    const fb = document.getElementById('feedback');
    fb.className = `feedback show ${type}`;
    fb.textContent = msg;
}

function hideFeedback() {
    document.getElementById('feedback').className = 'feedback';
}

/* ============================================================
   초기화 / 다음 문제
============================================================ */
function resetQuiz() {
    checked = false;
    const pool = document.getElementById('cardPool');
    document.querySelectorAll('.drop-slot').forEach(slot => {
        while (slot.children.length) pool.appendChild(slot.children[0]);
        slot.classList.remove('correct','wrong');
    });
    hideFeedback();
    document.getElementById('answerReveal').classList.remove('show');
    document.getElementById('btnNext').style.display = 'none';

    // 카드 셔플
    const cards = [...pool.querySelectorAll('.drag-card')];
    cards.sort(() => Math.random() - 0.5);
    cards.forEach(c => pool.appendChild(c));
    bindDragEvents();
}

function nextQuestion() {
    const total = GROUPS[currentGroup].length;
    if (currentQ < total - 1) {
        currentQ++;
        renderQuestion();
    } else {
        showResult();
    }
}

/* ============================================================
   결과 화면
============================================================ */
function showResult() {
    const total   = GROUPS[currentGroup].length;
    const correct = scores.filter(s => s === true).length;
    const wrong   = scores.filter(s => s === false).length;
    const pct     = Math.round((correct / total) * 100);

    document.getElementById('rCorrect').textContent = correct;
    document.getElementById('rWrong').textContent   = wrong;
    document.getElementById('rScore').textContent   = pct + '%';
    document.getElementById('resultEmoji').textContent =
        pct === 100 ? '🏆' : pct >= 50 ? '🎯' : '💪';
    document.getElementById('resultMsg').textContent =
        pct === 100 ? '완벽합니다! 모든 문제를 맞혔어요!' :
        pct >= 50   ? `${total}문제 중 ${correct}문제 정답! 조금만 더 연습해봐요.` :
                      '조건문 구조를 다시 한번 복습해보세요!';

    // 퀴즈 영역 숨기기
    ['cardPool','codeZone','missionBox','typeBadge'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
    });
    document.getElementById('feedback').classList.remove('show');
    document.getElementById('answerReveal').classList.remove('show');
    document.querySelector('.btn-row').style.display = 'none';

    document.getElementById('resultScreen').classList.add('show');
}

function restartGroup() {
    initGroup(currentGroup);
    // 숨겼던 요소 복원
    ['cardPool','codeZone','missionBox','typeBadge'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = '';
    });
    document.querySelector('.btn-row').style.display = '';
}

/* ============================================================
   초기화 실행
============================================================ */
window.onload = () => initGroup(0);
