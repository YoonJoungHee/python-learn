<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조건문 순서도 시뮬레이터</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ── 하드코딩 색상 (CSS 변수 없음 → 크롬 완전 호환) ── */
:root{
  --bg:#0f1117;
  --surface:#1a1d27;
  --surface2:#22263a;
  --border:#2e3350;
  --text:#e8eaf6;
  --text2:#8892b0;
  --text3:#4a5272;
  --accent:#4f8ef7;
  --green:#34d399;
  --red:#f87171;
  --yellow:#fbbf24;
  --orange:#fb923c;
  --purple:#a78bfa;
  --sans:'Nanum Gothic',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --radius:10px;

  /* 순서도 노드 색상 */
  --c-gray-fill:#22263a;   --c-gray-stroke:#4a5272;
  --c-teal-fill:#0f3a3a;   --c-teal-stroke:#2dd4bf;
  --c-amber-fill:#3a2800;  --c-amber-stroke:#fbbf24;
  --c-green-fill:#0a3320;  --c-green-stroke:#34d399;
  --c-red-fill:#3a0f0f;    --c-red-stroke:#f87171;
  --c-purple-fill:#1e1040; --c-purple-stroke:#a78bfa;
  --c-coral-fill:#3a1500;  --c-coral-stroke:#fb923c;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e8eaf6;font-family:'Nanum Gothic',sans-serif;min-height:100vh;padding:1rem}

/* ── 상단 헤더 ── */
.page-title{
  text-align:center;padding:1.5rem 1rem 1rem;
  font-size:1.3rem;font-weight:800;color:#e8eaf6;margin-bottom:1rem;
}
.page-title span{color:#4f8ef7}

/* ── 탭 ── */
.top-tabs{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.ttab{
  padding:7px 16px;border-radius:var(--radius);
  border:1px solid #2e3350;background:#1a1d27;
  color:#8892b0;font-size:13px;cursor:pointer;
  font-family:'Nanum Gothic',sans-serif;font-weight:700;
  transition:all .15s;
}
.ttab:hover{color:#e8eaf6;border-color:#4a5272}
.ttab.on{background:#1a1d27;color:#4f8ef7;border-color:#4f8ef7}

/* ── 유형별 패널 ── */
.fc-wrap{display:none}.fc-wrap.on{display:block}

/* ── 점수 버튼 ── */
.hint{font-size:12px;color:#8892b0;margin-bottom:10px}
.score-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem}
.sc-btn{
  padding:8px 0;width:72px;border-radius:var(--radius);
  border:1px solid #2e3350;background:#1a1d27;
  color:#e8eaf6;font-size:14px;font-weight:700;
  cursor:pointer;font-family:'Nanum Gothic',sans-serif;
  text-align:center;transition:all .15s;
}
.sc-btn:hover{border-color:#4f8ef7;color:#4f8ef7}
.sc-btn.chosen{background:#1a2a4a;border-color:#4f8ef7;color:#4f8ef7}

/* ── 컨트롤 바 ── */
.ctrl-bar{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.ctrl-btn{
  padding:7px 18px;border-radius:var(--radius);
  border:1px solid #2e3350;background:#1a1d27;
  color:#e8eaf6;font-size:13px;font-weight:700;
  cursor:pointer;font-family:'Nanum Gothic',sans-serif;
  transition:all .15s;
}
.ctrl-btn:hover{border-color:#4a5272;background:#22263a}
.ctrl-btn:disabled{opacity:.35;cursor:not-allowed}
.ctrl-btn.primary{border-color:#4f8ef7;color:#4f8ef7;background:#111d33}
.ctrl-btn.primary:hover{background:#1a2a4a}
.step-ind{font-size:12px;color:#8892b0;margin-left:auto}

/* ── 정보 박스 ── */
.info-box{
  padding:.875rem 1rem;border-radius:var(--radius);
  border:1px solid #2e3350;background:#1a1d27;
  margin-bottom:.75rem;min-height:52px;
  display:flex;align-items:center;gap:12px;
}
.info-icon{font-size:16px;min-width:20px}
.info-txt{font-size:13px;color:#e8eaf6;font-weight:700;line-height:1.5}
.info-sub{font-size:12px;color:#8892b0;margin-top:2px;font-family:'JetBrains Mono',monospace}

/* ── 결과 ── */
.result-row{
  padding:.875rem 1rem;border-radius:var(--radius);
  border:1px solid #2e3350;background:#1a1d27;
  margin-bottom:.75rem;display:flex;align-items:center;gap:10px;
}
.rlabel{font-size:12px;color:#8892b0}
.rval{font-size:18px;font-weight:800;margin-left:auto;color:#e8eaf6}
.rval.pass{color:#34d399}.rval.fail{color:#f87171}
.rval.A{color:#34d399}.rval.B{color:#4f8ef7}.rval.C{color:#fbbf24}
.rval.skip{color:#8892b0;font-size:13px;font-weight:400}
.rval.idle{color:#8892b0;font-size:13px;font-weight:400}

/* ── SVG 순서도 ── */
svg.fc{overflow:visible;display:block;width:100%;max-width:700px;margin:0 auto}

/* 노드 스타일 클래스 */
.c-gray  ellipse,.c-gray  rect,.c-gray  polygon{fill:#22263a;stroke:#4a5272;stroke-width:1}
.c-teal  ellipse,.c-teal  rect,.c-teal  polygon{fill:#0f3a3a;stroke:#2dd4bf;stroke-width:1}
.c-amber ellipse,.c-amber rect,.c-amber polygon{fill:#3a2800;stroke:#fbbf24;stroke-width:1}
.c-green ellipse,.c-green rect,.c-green polygon{fill:#0a3320;stroke:#34d399;stroke-width:1}
.c-red   ellipse,.c-red   rect,.c-red   polygon{fill:#3a0f0f;stroke:#f87171;stroke-width:1}
.c-purple ellipse,.c-purple rect,.c-purple polygon{fill:#1e1040;stroke:#a78bfa;stroke-width:1}
.c-coral ellipse,.c-coral rect,.c-coral polygon{fill:#3a1500;stroke:#fb923c;stroke-width:1}

.th{fill:#e8eaf6;font-family:'Nanum Gothic',sans-serif;font-size:13px;font-weight:700}
.ts{fill:#8892b0;font-family:'JetBrains Mono',monospace;font-size:11px}

/* 노드 하이라이트 */
.node-hl rect,.node-hl ellipse,.node-hl polygon{stroke-width:2.5!important;filter:drop-shadow(0 0 6px currentColor)}

/* 공(ball) */
.ball{transition:cx 900ms cubic-bezier(.4,0,.2,1),cy 900ms cubic-bezier(.4,0,.2,1),opacity .3s}

/* ── 화살표 색 ── */
.arr-main{stroke:#4a5272}
.arr-yes{stroke:#34d399}
.arr-no{stroke:#f87171}
.arr-warn{stroke:#fbbf24}

/* ── 스크롤바 ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#2e3350;border-radius:3px}
</style>
</head>
<body>
<div style="margin-bottom:1rem;display:flex;align-items:center;gap:12px">
  <a href="home.html" style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;background:#1a1d27;border:1px solid #2e3350;color:#8892b0;font-size:12px;font-weight:700;font-family:'Nanum Gothic',sans-serif;text-decoration:none;transition:all .15s" onmouseover="this.style.color='#e8eaf6';this.style.borderColor='#4a5272'" onmouseout="this.style.color='#8892b0';this.style.borderColor='#2e3350'">← 홈으로</a>

<div class="page-title">조건문 순서도 <span>애니메이션</span> 시뮬레이터</div>

    <g id="g2-B" class="c-teal"><rect x="514" y="394" width="120" height="40" rx="8"/><text class="th" x="574" y="414" text-anchor="middle" dominant-baseline="central">"B" 출력</text></g>
    <g id="g2-C" class="c-coral"><rect x="154" y="520" width="232" height="40" rx="8"/><text class="th" x="270" y="540" text-anchor="middle" dominant-baseline="central">"C" 출력 (else)</text></g>
    <text class="ts" x="56" y="544" text-anchor="middle" fill="#4a5272">else</text>
    <line x1="270" y1="560" x2="270" y2="618" stroke="#4a5272" stroke-width="1"/>
    <line x1="574" y1="268" x2="644" y2="268" stroke="#4a5272" stroke-width="1"/>
    <line x1="574" y1="434" x2="644" y2="434" stroke="#4a5272" stroke-width="1"/>
    <line x1="644" y1="268" x2="644" y2="618" stroke="#4a5272" stroke-width="1"/>
    <line x1="270" y1="618" x2="644" y2="618" stroke="#4a5272" stroke-width="1"/>
    <line x1="457" y1="618" x2="457" y2="642" stroke="#4a5272" stroke-width="1" marker-end="url(#ar2)"/>
    <g id="g2-end" class="c-gray"><ellipse cx="457" cy="668" rx="72" ry="26"/><text class="th" x="457" y="668" text-anchor="middle" dominant-baseline="central">끝</text></g>
    <circle id="ball2" class="ball" r="11" fill="#4f8ef7" opacity="0"/>
  </svg>
</div>

<script>
/* ── 단계 데이터 ── */
function makeSteps(ti, score){
  if(ti===0){
    const pass=score>=60;
    const common=[
      {x:300,y:44,  node:'g0-start', label:'시작',      sub:'프로그램이 시작됩니다'},
      {x:300,y:129, node:'g0-input', label:'점수 입력', sub:'score = '+score},
      {x:300,y:244, node:'g0-cond',  label:'조건 판단', sub:score+' >= 60  →  '+(pass?'True → Yes 경로 이동':'False → No 경로 이동')},
    ];
    if(pass) return [...common,
      {x:300,y:366, node:'g0-pass', label:'"합격" 출력',   sub:'if 블록 실행'},
      {x:300,y:420, node:null,      label:'합류 지점',     sub:'양쪽 경로가 만납니다'},
      {x:428,y:472, node:'g0-end',  label:'끝',           sub:'프로그램 종료', result:'합격', rcls:'pass'},
    ];
    return [...common,
      {x:420,y:244, node:null,     label:'No 경로',       sub:'else 없음 → 처리 없이 통과'},
      {x:560,y:244, node:null,     label:'No 경로 이동',  sub:'오른쪽으로 우회합니다'},
      {x:560,y:420, node:null,     label:'합류 지점',     sub:'양쪽 경로가 만납니다'},
      {x:428,y:472, node:'g0-end', label:'끝',           sub:'(출력 없음) 프로그램 종료', result:'(출력 없음)', rcls:'skip'},
    ];
  }
  if(ti===1){
    const pass=score>=60;
    const common=[
      {x:300,y:44,  node:'g1-start', label:'시작',      sub:'프로그램이 시작됩니다'},
      {x:300,y:129, node:'g1-input', label:'점수 입력', sub:'score = '+score},
      {x:300,y:248, node:'g1-cond',  label:'조건 판단', sub:score+' >= 60  →  '+(pass?'True → Yes 경로':'False → No 경로')},
    ];
    if(pass) return [...common,
      {x:300,y:374, node:'g1-pass', label:'"합격" 출력',  sub:'if 블록 실행'},
      {x:300,y:456, node:null,      label:'합류 지점',    sub:'양쪽 경로가 만납니다'},
      {x:432,y:504, node:'g1-end',  label:'끝',          sub:'프로그램 종료', result:'합격', rcls:'pass'},
    ];
    return [...common,
      {x:424,y:248, node:null,      label:'No 경로',      sub:'else 블록으로 이동합니다'},
      {x:564,y:248, node:null,      label:'else 경로 진입', sub:'오른쪽으로 이동'},
      {x:564,y:374, node:'g1-fail', label:'"불합격" 출력', sub:'else 블록 실행'},
      {x:564,y:456, node:null,      label:'합류 지점',    sub:'양쪽 경로가 만납니다'},
      {x:432,y:504, node:'g1-end',  label:'끝',          sub:'프로그램 종료', result:'불합격', rcls:'fail'},
    ];
  }
  if(ti===2){
    const common=[
      {x:270,y:44,  node:'g2-start', label:'시작',      sub:'프로그램이 시작됩니다'},
      {x:270,y:129, node:'g2-input', label:'점수 입력', sub:'score = '+score},
      {x:270,y:248, node:'g2-c1',   label:'if 조건 판단', sub:score+' >= 80  →  '+(score>=80?'True → A':'False → 다음 조건으로')},
    ];
    if(score>=80) return [...common,
      {x:390,y:248, node:null,   label:'Yes 경로', sub:'if 블록으로 이동'},
      {x:574,y:248, node:'g2-A', label:'"A" 출력',  sub:'if 블록 실행'},
      {x:644,y:268, node:null,   label:'합류',      sub:'오른쪽 경로 합류'},
      {x:644,y:618, node:null,   label:'아래로',    sub:'끝을 향해 이동'},
      {x:457,y:668, node:'g2-end', label:'끝',     sub:'프로그램 종료', result:'학점: A', rcls:'A'},
    ];
    if(score>=60) return [...common,
      {x:270,y:414, node:'g2-c2', label:'elif 조건 판단', sub:score+' >= 60  →  True → B'},
      {x:390,y:414, node:null,    label:'Yes 경로',       sub:'elif 블록으로 이동'},
      {x:574,y:414, node:'g2-B',  label:'"B" 출력',       sub:'elif 블록 실행'},
      {x:644,y:434, node:null,    label:'합류',           sub:'오른쪽 경로 합류'},
      {x:644,y:618, node:null,    label:'아래로',         sub:'끝을 향해 이동'},
      {x:457,y:668, node:'g2-end', label:'끝',           sub:'프로그램 종료', result:'학점: B', rcls:'B'},
    ];
    return [...common,
      {x:270,y:414, node:'g2-c2', label:'elif 조건 판단', sub:score+' >= 60  →  False → else로'},
      {x:270,y:540, node:'g2-C',  label:'"C" 출력',       sub:'else 블록 실행'},
      {x:270,y:618, node:null,    label:'합류',           sub:'아래로 이동'},
      {x:457,y:668, node:'g2-end', label:'끝',           sub:'프로그램 종료', result:'학점: C', rcls:'C'},
    ];
  }
}

const SCORES=[[30,45,59,60,75,90,100],[30,45,59,60,75,90,100],[40,55,59,60,75,80,85,95]];
const state=[{score:null,steps:[],cur:-1,playing:false},{score:null,steps:[],cur:-1,playing:false},{score:null,steps:[],cur:-1,playing:false}];
let curType=0;

function switchType(i,btn){
  curType=i;
  document.querySelectorAll('.ttab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.fc-wrap').forEach(f=>f.classList.remove('on'));
  document.getElementById('fc'+i).classList.add('on');
}

function selectScore(ti,score,btn){
  state[ti].playing=false;
  state[ti].score=score;
  state[ti].steps=makeSteps(ti,score);
  state[ti].cur=-1;
  document.querySelectorAll('#br'+ti+' .sc-btn').forEach(b=>b.classList.remove('chosen'));
  btn.classList.add('chosen');
  const ball=document.getElementById('ball'+ti);
  ball.style.transition='none';
  ball.setAttribute('cx',state[ti].steps[0].x);
  ball.setAttribute('cy',state[ti].steps[0].y);
  ball.setAttribute('opacity','0');
  clearHL(ti);
  setInfo(ti,'점수 선택됨','▶ 다음 단계를 클릭해 한 단계씩 진행하세요');
  const rv=document.getElementById('rv'+ti);rv.textContent='—';rv.className='rval idle';
  document.getElementById('si'+ti).textContent='0 / '+state[ti].steps.length;
  document.getElementById('btn'+ti+'-next').disabled=false;
  document.getElementById('btn'+ti+'-reset').disabled=false;
  document.getElementById('btn'+ti+'-auto').disabled=false;
  document.getElementById('btn'+ti+'-auto').textContent='자동 재생';
}

function nextStep(ti){
  const s=state[ti];
  if(s.cur>=s.steps.length-1)return;
  s.cur++;
  applyStep(ti,s.cur);
}

function applyStep(ti,idx){
  const s=state[ti];
  const step=s.steps[idx];
  const ball=document.getElementById('ball'+ti);
  if(idx===0){
    ball.style.transition='none';
    ball.setAttribute('cx',step.x);ball.setAttribute('cy',step.y);
    requestAnimationFrame(()=>{
      ball.style.transition='cx 900ms cubic-bezier(.4,0,.2,1),cy 900ms cubic-bezier(.4,0,.2,1),opacity .3s';
      ball.setAttribute('opacity','1');
    });
  } else {
    ball.style.transition='cx 900ms cubic-bezier(.4,0,.2,1),cy 900ms cubic-bezier(.4,0,.2,1),opacity .3s';
    ball.setAttribute('cx',step.x);ball.setAttribute('cy',step.y);
  }
  clearHL(ti);
  if(step.node) hlNode(ti,step.node);
  setInfo(ti,step.label,step.sub);
  document.getElementById('si'+ti).textContent=(idx+1)+' / '+s.steps.length;
  if(step.result){
    const rv=document.getElementById('rv'+ti);
    rv.textContent=step.result;rv.className='rval '+step.rcls;
  }
  const isLast=idx===s.steps.length-1;
  document.getElementById('btn'+ti+'-next').disabled=isLast;
  if(isLast&&s.playing){s.playing=false;document.getElementById('btn'+ti+'-auto').textContent='자동 재생';}
}

function resetFC(ti){
  const s=state[ti];s.playing=false;s.cur=-1;
  const ball=document.getElementById('ball'+ti);
  ball.style.transition='opacity .3s';ball.setAttribute('opacity','0');
  clearHL(ti);
  setInfo(ti,'점수를 선택하면 시작됩니다','');
  const rv=document.getElementById('rv'+ti);rv.textContent='—';rv.className='rval idle';
  document.getElementById('si'+ti).textContent=s.steps.length?'0 / '+s.steps.length:'—';
  document.getElementById('btn'+ti+'-next').disabled=!s.score;
  document.getElementById('btn'+ti+'-auto').textContent='자동 재생';
  if(s.steps.length){
    setTimeout(()=>{ball.style.transition='none';ball.setAttribute('cx',s.steps[0].x);ball.setAttribute('cy',s.steps[0].y);},350);
  }
}

function autoPlay(ti){
  const s=state[ti];if(!s.score)return;
  if(s.playing){s.playing=false;document.getElementById('btn'+ti+'-auto').textContent='자동 재생';return;}
  if(s.cur>=s.steps.length-1)resetFC(ti);
  s.playing=true;
  document.getElementById('btn'+ti+'-auto').textContent='일시 정지';
  function tick(){
    if(!s.playing)return;
    if(s.cur>=s.steps.length-1){s.playing=false;document.getElementById('btn'+ti+'-auto').textContent='자동 재생';return;}
    nextStep(ti);setTimeout(tick,1400);
  }
  setTimeout(tick,100);
}

function setInfo(ti,label,sub){
  document.getElementById('info'+ti).innerHTML=
    '<span class="info-icon">▶</span><div><div class="info-txt">'+label+'</div>'+(sub?'<div class="info-sub">'+sub+'</div>':'')+'</div>';
}

function hlNode(ti,nodeId){
  const g=document.getElementById(nodeId);if(!g)return;
  g.classList.add('node-hl');
}

function clearHL(ti){
  document.getElementById('fc'+ti).querySelectorAll('.node-hl').forEach(g=>g.classList.remove('node-hl'));
}

/* ── 버튼 생성 ── */
[0,1,2].forEach(ti=>{
  const row=document.getElementById('br'+ti);
  SCORES[ti].forEach(v=>{
    const b=document.createElement('button');
    b.className='sc-btn';b.textContent=v+'점';
    b.onclick=()=>selectScore(ti,v,b);
    row.appendChild(b);
  });
});
</script>
</body>
</html>
