<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ch.6 함수와 리스트 — 포켓몬 파이썬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=JetBrains+Mono:wght@400;600&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<style>

:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;
  --accent:#4f8ef7;--accent2:#a78bfa;--green:#34d399;--red:#f87171;--yellow:#fbbf24;
  --text:#e8eaf6;--text2:#8892b0;--text3:#4a5272;
  --mono:'JetBrains Mono',monospace;--sans:'Nanum Gothic',sans-serif;--body:'Gowun Dodum',sans-serif;
  --radius:10px;--topbar-h:52px;--tabbar-h:44px;--sub-w:200px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--body);display:flex;flex-direction:column}

/* ══ 최상단 로고바 ══ */
.topbar{
  height:var(--topbar-h);min-height:var(--topbar-h);
  background:rgba(15,17,23,.98);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 1.5rem;gap:12px;z-index:300;flex-shrink:0;
}
.logo{font-family:var(--sans);font-weight:800;font-size:17px;color:var(--accent);white-space:nowrap}
.logo-sub{font-size:12px;color:var(--text3);font-family:var(--sans);margin-left:4px}
.py-badge{
  margin-left:auto;padding:3px 10px;border-radius:20px;
  background:var(--surface2);border:1px solid var(--border);
  font-size:11px;font-family:var(--mono);color:var(--text3);white-space:nowrap;
  transition:color .3s,border-color .3s;
}
.py-badge.ready{color:var(--green);border-color:rgba(52,211,153,.4)}

/* ══ 메인 탭바 (상단 메뉴) ══ */
.tabbar{
  height:var(--tabbar-h);min-height:var(--tabbar-h);
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:stretch;padding:0 1rem;gap:2px;z-index:200;flex-shrink:0;
}
.tab{
  display:flex;align-items:center;gap:7px;
  padding:0 18px;font-family:var(--sans);font-weight:700;font-size:13px;
  color:var(--text2);cursor:pointer;border:none;background:none;
  border-bottom:2px solid transparent;white-space:nowrap;
  transition:color .15s,border-color .15s;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .t-icon{font-size:14px}

/* ══ 바디 (서브메뉴 + 콘텐츠) ══ */
.body-wrap{display:flex;flex:1;overflow:hidden}

/* ══ 왼쪽 서브메뉴 패널 ══ */
.submenu{
  width:0;min-width:0;overflow:hidden;flex-shrink:0;
  background:#13161f;border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:width .22s cubic-bezier(.4,0,.2,1);
}
.submenu.open{width:var(--sub-w)}
.sm-hd{
  padding:14px 16px 10px;font-family:var(--sans);font-weight:800;font-size:11px;
  color:var(--accent);letter-spacing:.05em;border-bottom:1px solid var(--border);
  white-space:nowrap;flex-shrink:0;
}
.sm-list{overflow-y:auto;flex:1;padding:6px 0}
.sm-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 16px;width:100%;border:none;background:none;text-align:left;
  font-family:var(--sans);font-weight:700;font-size:12px;color:var(--text2);
  cursor:pointer;border-left:2px solid transparent;white-space:nowrap;
  transition:background .12s,color .12s,border-color .12s;
}
.sm-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.sm-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(79,142,247,.07)}
.sm-item .sm-icon{font-size:13px;min-width:18px;text-align:center}
.sm-item .sm-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.sm-badge{
  flex-shrink:0;font-size:10px;padding:1px 5px;border-radius:8px;
  background:var(--surface2);color:var(--text3);font-family:var(--mono);
}
.sm-badge.easy{background:rgba(52,211,153,.12);color:var(--green)}
.sm-badge.mid{background:rgba(251,191,36,.1);color:var(--yellow)}
.sm-badge.solved{background:rgba(52,211,153,.12);color:var(--green)}
.sm-section{
  padding:10px 16px 4px;font-size:10px;font-family:var(--sans);
  font-weight:700;color:var(--text3);letter-spacing:.06em;
}

/* ══ 메인 콘텐츠 ══ */
.main{flex:1;overflow-y:auto;padding:2rem 2.5rem;min-width:0}

/* ══ 페이지 ══ */
.page{display:none}.page.active{display:block}

/* ══ 홈 ══ */
.hero{
  text-align:center;padding:2.5rem 1rem 2rem;border-radius:16px;margin-bottom:1.5rem;
  background:radial-gradient(ellipse 60% 45% at 50% 0%,rgba(79,142,247,.11),transparent);
}
.hero h1{font-family:var(--sans);font-size:2.2rem;font-weight:800;line-height:1.2;margin-bottom:.65rem}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--text2);font-size:.95rem;max-width:480px;margin:0 auto 1.25rem;line-height:1.7}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:1.5rem}
.pill{padding:4px 12px;border-radius:20px;font-size:11px;font-family:var(--sans);font-weight:700;border:1px solid var(--border);color:var(--text2);background:var(--surface)}
.sec-label{font-size:10px;font-family:var(--sans);font-weight:700;color:var(--text3);letter-spacing:.06em;margin-bottom:.75rem}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px}
.ch-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1.1rem;cursor:pointer;transition:border-color .2s,transform .15s}
.ch-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.ch-card .cn{font-family:var(--mono);font-size:10px;color:var(--accent);margin-bottom:4px}
.ch-card .ct{font-family:var(--sans);font-weight:700;font-size:13px;margin-bottom:3px}
.ch-card .cd{font-size:11px;color:var(--text2);line-height:1.5}

/* ══ 강의 ══ */
.ls-title{font-family:var(--sans);font-weight:800;font-size:1.3rem;margin-bottom:.875rem}
.prog-bar{height:3px;background:var(--border);border-radius:2px;margin-bottom:1.5rem;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.ls-body{line-height:1.85;font-size:14px}
.ls-body h3{font-family:var(--sans);font-weight:800;font-size:.95rem;margin:1.5rem 0 .5rem;color:var(--accent2)}
.ls-body p{color:var(--text2);margin-bottom:.65rem}
.ls-body ul{color:var(--text2);padding-left:1.2rem;margin-bottom:.65rem}
.ls-body li{margin-bottom:.25rem}
.ls-body strong{color:var(--text);font-weight:700}
.tip-box{background:rgba(79,142,247,.07);border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:.75rem 1rem;margin:.875rem 0;font-size:13px;color:var(--text2)}
.tip-box strong{color:var(--accent);display:block;margin-bottom:3px;font-family:var(--sans)}
.warn-box{background:rgba(251,191,36,.05);border-left:3px solid var(--yellow);border-radius:0 var(--radius) var(--radius) 0;padding:.75rem 1rem;margin:.875rem 0;font-size:13px;color:var(--text2)}
.warn-box strong{color:var(--yellow);display:block;margin-bottom:3px;font-family:var(--sans)}
.ls-nav{display:flex;gap:10px;margin-top:2rem;justify-content:flex-end;padding-top:1rem;border-top:1px solid var(--border)}
.ls-nav button{padding:7px 18px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-family:var(--sans);font-weight:700;cursor:pointer;transition:all .15s}
.ls-nav button:hover{border-color:var(--accent);color:var(--accent)}
.ls-nav button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ls-nav button.primary:hover{background:#3a7de8}

/* ══ 코드블록 ══ */
.code-block{background:#0d1117;border:1px solid var(--border);border-radius:var(--radius);margin:.875rem 0;overflow:hidden}
.code-hd{padding:6px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.code-lang{font-family:var(--mono);font-size:10px;color:var(--text3)}
pre{padding:.875rem 1.25rem;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.7;color:#cdd6f4}
.kw{color:#cba6f7}.st{color:#a6e3a1}.cm{color:#6a7090}.fn{color:#89dceb}

/* ══ 에디터 ══ */
.ed-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:.875rem 0;overflow:hidden}
.ed-hd{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}
.ed-title{font-family:var(--sans);font-weight:700;font-size:12px;color:var(--text2);flex:1}
.run-btn{padding:5px 15px;border-radius:7px;background:var(--accent);border:none;color:#fff;font-size:12px;font-family:var(--sans);font-weight:700;cursor:pointer;transition:background .15s}
.run-btn:hover{background:#3a7de8}
.run-btn:disabled{background:var(--surface2);cursor:not-allowed;color:var(--text3)}
.ed-ta{width:100%;padding:.875rem 1.25rem;background:#0d1117;border:none;resize:vertical;min-height:120px;font-family:var(--mono);font-size:12px;line-height:1.7;color:#cdd6f4;outline:none;tab-size:4}
.out-area{padding:.875rem 1.25rem;background:#070a0f;border-top:1px solid var(--border);font-family:var(--mono);font-size:12px;line-height:1.7;min-height:48px;color:var(--green);white-space:pre-wrap}
.out-area.error{color:var(--red)}.out-area.idle{color:var(--text3)}

/* ══ 실습 ══ */
.pg-title{font-family:var(--sans);font-weight:800;font-size:1.2rem;margin-bottom:.4rem}
.pg-desc{font-size:13px;color:var(--text2);margin-bottom:1.1rem}
.snip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;margin-top:.75rem}
.snip-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem 1rem;cursor:pointer;transition:border-color .2s}
.snip-card:hover{border-color:var(--accent)}
.snip-card .sl{font-family:var(--sans);font-weight:700;font-size:12px;margin-bottom:4px}
.snip-card .sp{font-size:10px;color:var(--text3);font-family:var(--mono)}

/* ══ 저지 ══ */
.jg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:1.25rem}
.jg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;cursor:pointer;transition:border-color .2s,transform .15s}
.jg-card:hover{border-color:var(--accent2);transform:translateY(-2px)}
.badge{display:inline-block;font-size:10px;font-family:var(--sans);font-weight:700;padding:2px 7px;border-radius:20px;margin-bottom:5px}
.badge.easy{background:rgba(52,211,153,.15);color:var(--green)}
.badge.mid{background:rgba(251,191,36,.12);color:var(--yellow)}
.badge.hard{background:rgba(248,113,113,.12);color:var(--red)}
.jg-card .jt{font-family:var(--sans);font-weight:700;font-size:13px;margin-bottom:3px}
.jg-card .jd{font-size:11px;color:var(--text2);line-height:1.5}
.jstat{float:right;width:17px;height:17px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px}
.jstat.solved{background:rgba(52,211,153,.15);border-color:var(--green);color:var(--green)}
.prob-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:.875rem}
.prob-box h3{font-family:var(--sans);font-weight:800;font-size:.875rem;margin-bottom:.5rem}
.prob-box p,.prob-box li{font-size:12.5px;color:var(--text2);line-height:1.7;margin-bottom:.25rem}
.io-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:.5rem 0}
.io-box{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem}
.io-label{font-size:10px;font-family:var(--sans);font-weight:700;color:var(--text3);margin-bottom:4px}
.io-val{font-family:var(--mono);font-size:12px;color:var(--text2)}
.submit-row{display:flex;gap:10px;margin-top:.875rem;align-items:center;flex-wrap:wrap}
.submit-btn{padding:7px 20px;border-radius:var(--radius);background:var(--accent2);border:none;color:#fff;font-size:13px;font-family:var(--sans);font-weight:700;cursor:pointer;transition:background .15s}
.submit-btn:hover{background:#9061f9}
.submit-btn:disabled{background:var(--border);cursor:not-allowed;color:var(--text3)}
.verdict{padding:6px 14px;border-radius:var(--radius);font-family:var(--sans);font-weight:700;font-size:12px;display:none}
.verdict.ac{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.3)}
.verdict.wa{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.verdict.show{display:inline-flex;align-items:center;gap:5px}

/* 스크롤바 */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* 챕터 전용 추가 스타일 */
.main{max-width:860px;margin:0 auto;padding:2rem 1.5rem}
.ch-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-family:var(--sans);font-weight:700;background:rgba(79,142,247,.1);border:1px solid rgba(79,142,247,.25);color:var(--accent);margin-bottom:1rem}
.topbar{height:var(--topbar-h);min-height:var(--topbar-h);background:rgba(15,17,23,.98);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.5rem;gap:12px;z-index:300;flex-shrink:0;position:sticky;top:0}
body{overflow:auto}
.ls-nav{display:flex;gap:10px;margin-top:2rem;justify-content:space-between;align-items:center;padding-top:1rem;border-top:1px solid var(--border)}
.ls-nav a{padding:7px 18px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-family:var(--sans);font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:all .15s}
.ls-nav a:hover{border-color:var(--accent);color:var(--accent)}
.ls-nav a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ls-nav a.primary:hover{background:#3a7de8;color:#fff}
</style>
</head>
<body>

<!-- 네비바 -->
<div class="topbar">
  <a href="../index.html" class="logo" style="text-decoration:none">⚡ 포켓몬 파이썬</a>
  <span class="logo-sub">· Ch.6 / 6</span>
  <div class="py-badge" id="pyBadge">Python 로딩 중...</div>
</div>

<!-- 본문 -->
<div class="main">
  <div class="ch-badge">📋 Chapter 6 — 함수와 리스트</div>
  <div class="ls-title">Ch.6 — 📋 함수와 리스트</div>
  <div class="prog-bar"><div class="prog-fill" style="width:100%"></div></div>

  <div class="ls-body" id="lsBody"></div>

  <div class="ls-nav">
    <div><a href="ch05-loops.html">← 이전 챕터</a></div>
    <div><a href="../index.html" class="primary">강의 홈으로 →</a></div>
  </div>
</div>

<script>

function cb(code){
  const escaped = code
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const tokens = [];
  let result = escaped;
  result = result.replace(/(\"(?:[^\"\\]|\\.)*\"|'(?:[^'\\]|\\.)*')/g, (m)=>{
    const idx = tokens.length;
    tokens.push(`<span class="st">${m}</span>`);
    return `\x00${idx}\x00`;
  });
  result = result.replace(/(#[^\n]*)/g, (m)=>{
    const idx = tokens.length;
    tokens.push(`<span class="cm">${m}</span>`);
    return `\x00${idx}\x00`;
  });
  result = result.replace(/\b(print|input|range|len|sum|type|int|float|str|list|map|def|return|append)\b/g,
    '<span class="fn">$1</span>');
  result = result.replace(/\b(if|elif|else|for|while|in|and|or|not|True|False|end)\b/g,
    '<span class="kw">$1</span>');
  result = result.replace(/\x00(\d+)\x00/g, (_, i)=>tokens[parseInt(i)]);
  return `<div class="code-block"><div class="code-hd"><span class="code-lang">python</span></div><pre>${result}</pre></div>`;
}
function eb(id, code){
  return `<div class="ed-wrap">
    <div class="ed-hd">
      <span class="ed-title">직접 실행해 보세요</span>
      <button class="run-btn" id="rb${id}" onclick="runEd('${id}')" disabled>▶ 실행</button>
    </div>
    <textarea class="ed-ta" id="ec${id}" spellcheck="false">${code.trim()}</textarea>
    <div class="out-area idle" id="eo${id}">▶ 실행 버튼을 누르면 결과가 나옵니다.</div>
  </div>`;
}

let pyodide = null;
async function initPy(){
  try{
    pyodide = await loadPyodide();
    document.getElementById('pyBadge').textContent = 'Python 준비됨 ✓';
    document.getElementById('pyBadge').classList.add('ready');
    document.querySelectorAll('.run-btn').forEach(b=>b.disabled=false);
  }catch(e){
    document.getElementById('pyBadge').textContent = '로드 실패';
  }
}
async function runPy(code, inp=''){
  if(!pyodide) return {out:'Python 로딩 중입니다.',err:true};
  pyodide.globals.set('__il__', inp.split('\n'));
  const setup = `
import sys,builtins
from io import StringIO
_l=__il__;_i=[0]
def _fi(p=''):
    v=_l[_i[0]] if _i[0]<len(_l) else '';_i[0]+=1;return v
builtins.input=_fi
sys.stdout=StringIO();sys.stderr=StringIO()
`;
  try{
    await pyodide.runPythonAsync(setup+code);
    return {out:pyodide.globals.get('sys').stdout.getvalue()||'(출력 없음)',err:false};
  }catch(e){return {out:String(e),err:true};}
}
async function runEd(id){
  const btn=document.getElementById('rb'+id), out=document.getElementById('eo'+id);
  btn.disabled=true; btn.textContent='실행 중...';
  out.className='out-area idle'; out.textContent='실행 중...';
  const r = await runPy(document.getElementById('ec'+id).value);
  out.className='out-area'+(r.err?' error':''); out.textContent=r.out;
  btn.disabled=false; btn.textContent='▶ 실행';
}


/* ── 챕터 콘텐츠 렌더링 ── */
function renderContent() {
  const container = document.getElementById('lsBody');
  container.innerHTML = (function(){
    return `
<h3>함수 정의와 호출</h3>
${cb(`def greet(name):
    print("안녕하세요,", name + "!")

greet("김철수")
greet("이영희")`)}
<h3>return으로 값 반환</h3>
${cb(`def add(a, b):
    return a + b

result = add(3, 5)
print(result)   # 8`)}
<h3>리스트</h3>
${cb(`fruits = ["사과", "바나나", "오렌지"]
print(fruits[0])       # 사과
print(len(fruits))     # 3
fruits.append("포도")
for f in fruits:
    print(f)`)}
<div class="tip-box"><strong>💡 인덱스</strong>첫 번째 원소는 [0], 마지막은 [-1]로 접근합니다.</div>
${eb(5,`def average(scores):
    return sum(scores) / len(scores)

my_scores = [85, 92, 78, 90, 88]
avg = average(my_scores)
print("점수:", my_scores)
print("평균:", avg)`)}
`;
  })();
}

renderContent();
initPy();
</script>
